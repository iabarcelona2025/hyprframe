<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYPRFRAME - Cinematic Look Builder V3.0.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e7eb;
            overflow: hidden; 
        }
        
        .glass-panel {
            background: rgba(23, 23, 23, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }

        input[type="range"] {
            appearance: none;
            background: transparent;
            width: 100%; 
            display: block;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #d1d5db;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #27272a;
            border-radius: 2px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .stock-option:hover {
            background-color: rgba(196, 181, 253, 0.1); 
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 flex items-start justify-center pt-6 md:pt-10">

    <div class="max-w-[1550px] w-full grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        
        <!-- COLUMN 1: Full Technical Configuration -->
        <div class="glass-panel p-6 rounded-2xl shadow-2xl overflow-y-auto h-[94vh]">
            <header class="mb-6 border-b border-white/10 pb-4">
                <div class="flex items-center gap-4 mb-1">
                    <div class="flex items-center gap-3">
                        <i data-lucide="clapperboard" class="text-violet-300 w-6 h-6"></i>
                        <h1 class="text-xl font-bold tracking-tight uppercase">
                            Look Builder <span class="text-violet-300">V3.0.9</span>
                        </h1>
                    </div>
                </div>
                <p class="text-[10px] text-gray-500 uppercase tracking-widest font-semibold">HYPRFRAME.COM PRO PIPELINE</p>
            </header>

            <div class="space-y-6">
                <!-- Camera Select -->
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-zinc-500 uppercase flex items-center gap-2">
                        <i data-lucide="camera" class="w-3.5 h-3.5"></i> SENSOR / CAMERA BODY
                    </label>
                    <select id="camera" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-violet-400/50 outline-none transition-all">
                        <optgroup label="Analog Film">
                            <option value="IMAX MSM 9802 (65mm)">IMAX MSM 9802 (15/65mm Large Format)</option>
                            <option value="Arricam ST (35mm)">Arricam ST (35mm 3-Slat/4-Slat)</option>
                            <option value="Arriflex 435 (35mm)">Arriflex 435 (35mm High-Speed)</option>
                            <option value="Arriflex 235 (35mm)">Arriflex 235 (Compact 35mm)</option>
                            <option value="Panavision Millennium XL2 (35mm)">Panaflex Millennium XL2 (35mm)</option>
                            <option value="Arriflex 416 (Super 16mm)">Arriflex 416 (Super 16mm)</option>
                            <option value="Bolex H16 (16mm)">Bolex H16 (Classic 16mm Spring-Wound)</option>
                        </optgroup>
                        <optgroup label="Digital Cinema Flagships">
                            <option value="ARRI Alexa 35" selected>ARRI Alexa 35 (Super 35 4.6K - REVEAL)</option>
                            <option value="ARRI Alexa Mini LF">ARRI Alexa Mini LF (Full Frame)</option>
                            <option value="Sony Venice 2">Sony Venice 2 (8K X-OCN)</option>
                            <option value="RED V-Raptor XL 8K">RED V-Raptor XL 8K VV</option>
                            <option value="Panavision Millennium DXL2">Panavision Millennium DXL2 (8K)</option>
                        </optgroup>
                        <optgroup label="Specialized & B-Cam">
                            <option value="Phantom Flex4K">Phantom Flex4K (Ultra High-Speed)</option>
                            <option value="Sony FX6">Sony FX6 (Digital Full Frame)</option>
                            <option value="Blackmagic URSA Mini Pro 12K">Blackmagic URSA 12K</option>
                            <option value="RED Komodo-X">RED Komodo-X (6K Global Shutter)</option>
                            <option value="Sony FX9">Sony FX9 (Full Frame)</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Optics & Focal -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase">OPTICS</label>
                        <select id="lens" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2.5 text-xs outline-none">
                            <optgroup label="Modern / Clean">
                                <option value="ARRI Signature Prime" selected>ARRI Signature Prime</option>
                                <option value="Zeiss Master Prime f/1.4">Zeiss Master Prime</option>
                                <option value="Leitz Summicron-C">Leitz Summicron-C</option>
                                <option value="Cooke S8/i">Cooke S8/i (Full Frame)</option>
                            </optgroup>
                            <optgroup label="Vintage / Character">
                                <option value="Cooke Speed Panchro">Cooke Speed Panchro</option>
                                <option value="Canon K35">Canon K35 (Vintage Prime)</option>
                                <option value="Bausch & Lomb Super Baltar">Bausch & Lomb Super Baltar</option>
                                <option value="Kern-Paillard Switar">Kern-Paillard Switar (16mm)</option>
                                <option value="Angénieux Optimo">Angénieux Optimo Zoom</option>
                            </optgroup>
                            <optgroup label="Anamorphic">
                                <option value="Panavision C-Series Anamorphic">Panavision C-Series</option>
                                <option value="Hawk V-Lite Anamorphic">Hawk V‑Lite</option>
                                <option value="Atlas Orion Anamorphic">Atlas Orion</option>
                                <option value="Lomo Anamorphic">Lomo Anamorphic</option>
                                <option value="Kowa Anamorphic">Kowa Anamorphic</option>
                                <option value="Todd-AO Anamorphic">Todd-AO Anamorphic</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase">FOCAL</label>
                        <select id="distance" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2.5 text-xs outline-none">
                            <option value="10mm">10mm</option>
                            <option value="14mm">14mm</option>
                            <option value="18mm">18mm</option>
                            <option value="25mm">25mm</option>
                            <option value="35mm" selected>35mm</option>
                            <option value="50mm">50mm</option>
                            <option value="75mm">75mm</option>
                            <option value="85mm">85mm</option>
                            <option value="135mm">135mm</option>
                            <option value="200mm">200mm</option>
                        </select>
                    </div>
                </div>

                <!-- Exclusion Logic -->
                <div class="space-y-4">
                    <div class="space-y-1 relative">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase">Profile (LOG)</label>
                        <button id="profile-button" onclick="toggleProfileDropdown()" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2.5 text-xs text-left flex justify-between items-center transition-all">
                            <span id="profile-display">None</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-500"></i>
                        </button>
                        <div id="profile-dropdown" class="hidden absolute z-50 w-full mt-1 bg-zinc-900 border border-zinc-700 rounded-lg shadow-2xl max-h-40 overflow-y-auto glass-panel"></div>
                        <input type="hidden" id="camera-profile" value="None">
                    </div>

                    <div class="space-y-1 relative">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase">Film Stock (Emulsion)</label>
                        <button id="stock-button" onclick="toggleStockDropdown()" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2.5 text-xs text-left flex justify-between items-center transition-all">
                            <span id="stock-display">None</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-500"></i>
                        </button>
                        <div id="stock-dropdown" class="hidden absolute z-50 w-full mt-1 bg-zinc-900 border border-zinc-700 rounded-lg shadow-2xl max-h-60 overflow-y-auto glass-panel"></div>
                        <input type="hidden" id="stock" value="None">
                    </div>
                </div>

                <!-- Sliders -->
                <div class="space-y-4 pt-4 border-t border-white/5">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <div class="flex justify-between text-[10px] uppercase text-zinc-400">
                                <span>Saturation</span>
                                <span id="satValue" class="text-violet-300 font-bold">5.00</span>
                            </div>
                            <input type="range" id="saturation" min="0" max="10" value="5.00" step="0.01" oninput="updateVal('satValue', parseFloat(this.value).toFixed(2))">
                        </div>
                        <div class="space-y-1">
                            <div class="flex justify-between text-[10px] uppercase text-zinc-400">
                                <span>Halation</span>
                                <span id="halValue" class="text-violet-300 font-bold">0.00</span>
                            </div>
                            <input type="range" id="halation" min="0" max="10" value="0.00" step="0.01" oninput="updateVal('halValue', parseFloat(this.value).toFixed(2))">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <div class="flex justify-between text-[10px] uppercase text-zinc-400">
                                <span>Grain</span>
                                <span id="grnValue" class="text-violet-300 font-bold">0.00</span>
                            </div>
                            <input type="range" id="grain" min="0" max="10" value="0.00" step="0.01" oninput="updateVal('grnValue', parseFloat(this.value).toFixed(2))">
                        </div>
                        <div class="space-y-1">
                            <div class="flex justify-between text-[10px] uppercase text-zinc-400">
                                <span>Vignette</span>
                                <span id="vigValue" class="text-violet-300 font-bold">0.00</span>
                            </div>
                            <input type="range" id="vignette" min="0" max="10" value="0.00" step="0.01" oninput="updateVal('vigValue', parseFloat(this.value).toFixed(2))">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] uppercase text-zinc-400">
                            <span>White Point</span>
                            <span id="whiteValue" class="text-violet-300 font-bold">5600K</span>
                        </div>
                        <input type="range" id="whitePoint" min="1000" max="10000" value="5600" step="100" oninput="updateVal('whiteValue', this.value + 'K')">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <div class="flex justify-between text-[10px] uppercase text-zinc-400">
                                <span>Contrast</span>
                                <span id="conValue">32:1</span>
                            </div>
                            <input type="range" id="contrast" min="1" max="100" value="32" oninput="updateVal('conValue', this.value + ':1')">
                        </div>
                        <div class="space-y-1">
                            <div class="flex justify-between text-[10px] uppercase text-zinc-400">
                                <span>Skin (IRE)</span>
                                <span id="lumaValue" class="text-violet-300 font-bold">65 IRE</span>
                            </div>
                            <input type="range" id="skinLuma" min="0" max="100" value="65" oninput="updateVal('lumaValue', this.value + ' IRE')">
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <button onclick="generarTodo()" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 group">
                        <i data-lucide="refresh-cw" class="w-4 h-4 group-active:rotate-180 transition-transform"></i>
                        GENERATE PIPELINE V3.0.9
                    </button>
                    <p class="text-center text-[7px] text-zinc-500 uppercase tracking-widest opacity-60">© 2026 Hyprframe. All rights reserved.</p>
                </div>
            </div>
        </div>

        <!-- COLUMN 2: Metadata (JSON) -->
        <div class="flex flex-col gap-4 h-[94vh]">
            <div class="glass-panel p-6 rounded-2xl flex-1 flex flex-col relative overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-zinc-500 flex items-center gap-2">
                        <i data-lucide="code" class="w-3.5 h-3.5"></i> Technical JSON
                    </h3>
                    <button onclick="copyToClipboard('resultado')" class="text-violet-300 hover:text-violet-200 text-[10px] font-bold uppercase">COPY</button>
                </div>
                <div class="flex-1 bg-black/40 rounded-xl p-4 border border-white/5 overflow-auto custom-scrollbar">
                    <pre id="resultado" class="code-font text-[#A9D12F] text-[10px] leading-relaxed">{}</pre>
                </div>
            </div>
        </div>

        <!-- COLUMN 3: Semantic Prompt -->
        <div class="flex flex-col gap-4 h-[94vh]">
            <div class="glass-panel p-6 rounded-2xl flex-1 flex flex-col relative border-l-2 border-violet-500/50">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-violet-300 flex items-center gap-2">
                        <i data-lucide="message-square" class="w-3.5 h-3.5"></i> Semantic Prompt
                    </h3>
                    <button onclick="copyToClipboard('promptResultado')" class="text-violet-300 hover:text-violet-200 text-[10px] font-bold uppercase">COPY PROMPT</button>
                </div>
                <div class="flex-1 bg-zinc-900/80 rounded-xl p-6 border border-white/5 overflow-auto custom-scrollbar">
                    <div id="promptResultado" class="text-zinc-300 text-sm leading-relaxed italic font-light"></div>
                </div>
            </div>
        </div>

    </div>

    <div id="copyToast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-emerald-600 text-white text-xs py-2 px-4 rounded-full opacity-0 transition-opacity pointer-events-none">Copied!</div>

    <script>
        const profilesData = [
            { name: "None", desc: "(No profile mapping)" },
            { name: "ARRI LogC4", desc: "17 stops DR / Alexa 35 standard" },
            { name: "Sony S-Log3", desc: "Cineon-style / High shadow latitude" },
            { name: "RED Log3G10", desc: "IPP2 mapping / 10-stop mid-gray" },
            { name: "Blackmagic Film Gen 5", desc: "Advanced highlight roll-off" },
            { name: "Canon C-Log3", desc: "1600% DR / 34.3 IRE balance" },
            { name: "Panasonic V-Log", desc: "Linear mid-tones / Varicam matching" }
        ];

        const stocksData = {
            "Neutral / Bypass": [{ name: "None", desc: "(Digital neutral)" }],
            "Color Film (Negative)": [
                { name: "Kodak Portra 160/400/800", desc: "Natural skin/Bronze tones" },
                { name: "Kodak Ektar 100", desc: "Vivid/Fine grain" },
                { name: "Kodak Gold 200", desc: "Warm/Vintage" },
                { name: "Kodak ColorPlus 200", desc: "Nostalgic/Yellow bias" },
                { name: "Kodak Ultramax 400", desc: "Saturated/Versatile" },
                { name: "Fujifilm Superia 400", desc: "Green tints/Shadows" },
                { name: "CineStill 800T", desc: "Tungsten/Red halos" },
                { name: "CineStill 50D", desc: "Daylight cinematic" },
                { name: "Wolfen NC500", desc: "Urban/Muted" },
                { name: "Phoenix 200", desc: "Harman experimental/Gritty" },
                { name: "Aerocolor IV", desc: "Vibrant/Aerial clarity" }
            ],
            "Black & White Film": [
                { name: "Kodak Tri-X 400", desc: "Classic grain/Contrast" },
                { name: "Kodak T-MAX 100/400", desc: "Ultra-sharp tabular" },
                { name: "Ilford HP5 Plus 400", desc: "Flexible Gray range" },
                { name: "Rollei Retro 80s", desc: "Deep contrast/IR feel" }
            ],
            "Slide / Special": [
                { name: "Fujifilm Provia 100F", desc: "Realistic color/High fidelity" },
                { name: "Kodak Ektachrome E100", desc: "Clean Blue/Fine grain" },
                { name: "Fujifilm Velvia 50/100", desc: "Hyper-saturated landscape" },
                { name: "LomoChrome Purple", desc: "IR color-swap mapping" },
                { name: "LomoChrome Metropolis", desc: "Desaturated urban-noir" }
            ]
        };

        function initDropdowns() {
            const pDrop = document.getElementById('profile-dropdown');
            pDrop.innerHTML = profilesData.map(p => `
                <div class="stock-option px-3 py-2 text-[11px] cursor-pointer border-b border-white/5" onclick="selectProfile('${p.name}', '${p.desc}')">
                    <span class="font-bold">${p.name}</span> <span class="text-zinc-500">${p.desc}</span>
                </div>`).join('');

            const sDrop = document.getElementById('stock-dropdown');
            let sHtml = '';
            for (const cat in stocksData) {
                sHtml += `<div class="px-3 py-1 bg-white/5 text-[9px] font-bold uppercase text-violet-400">${cat}</div>`;
                stocksData[cat].forEach(s => {
                    sHtml += `<div class="stock-option px-3 py-2 text-[11px] cursor-pointer border-b border-white/5" onclick="selectStock('${s.name}', '${s.desc}')">
                        <span class="font-bold">${s.name}</span> <span class="text-zinc-500">${s.desc}</span>
                    </div>`;
                });
            }
            sDrop.innerHTML = sHtml;
        }

        function toggleProfileDropdown() { document.getElementById('profile-dropdown').classList.toggle('hidden'); document.getElementById('stock-dropdown').classList.add('hidden'); }
        function toggleStockDropdown() { document.getElementById('stock-dropdown').classList.toggle('hidden'); document.getElementById('profile-dropdown').classList.add('hidden'); }

        function updateExclusion() {
            const p = document.getElementById('camera-profile').value;
            const s = document.getElementById('stock').value;
            const pBtn = document.getElementById('profile-button');
            const sBtn = document.getElementById('stock-button');
            sBtn.classList.toggle('opacity-30', p !== "None");
            sBtn.style.pointerEvents = p !== "None" ? "none" : "auto";
            pBtn.classList.toggle('opacity-30', s !== "None");
            pBtn.style.pointerEvents = s !== "None" ? "none" : "auto";
        }

        function setSliderValues(sat, hal, grn, vig, white, con, luma) {
            document.getElementById('saturation').value = sat; updateVal('satValue', parseFloat(sat).toFixed(2));
            document.getElementById('halation').value = hal; updateVal('halValue', parseFloat(hal).toFixed(2));
            document.getElementById('grain').value = grn; updateVal('grnValue', parseFloat(grn).toFixed(2));
            document.getElementById('vignette').value = vig; updateVal('vigValue', parseFloat(vig).toFixed(2));
            document.getElementById('whitePoint').value = white; updateVal('whiteValue', white + 'K');
            document.getElementById('contrast').value = con; updateVal('conValue', con + ':1');
            document.getElementById('skinLuma').value = luma; updateVal('lumaValue', luma + ' IRE');
        }

        function selectProfile(name, desc) {
            document.getElementById('profile-display').innerHTML = `${name} <span class="text-[10px] opacity-50 ml-1 font-normal">${desc}</span>`;
            document.getElementById('camera-profile').value = name;
            document.getElementById('profile-dropdown').classList.add('hidden');
            if(name !== "None") { 
                document.getElementById('stock').value = "None"; 
                document.getElementById('stock-display').innerText = "None"; 
            }
            updateExclusion();
            setSliderValues(5.00, 0.00, 0.00, 0.00, 5600, 32, 65);
        }

        function selectStock(name, desc) {
            document.getElementById('stock-display').innerHTML = `${name} <span class="text-[10px] opacity-50 ml-1 font-normal">${desc}</span>`;
            document.getElementById('stock').value = name;
            document.getElementById('stock-dropdown').classList.add('hidden');
            if(name !== "None") { 
                document.getElementById('camera-profile').value = "None"; 
                document.getElementById('profile-display').innerText = "None"; 
            }
            updateExclusion();
            
            // Check if it's a B&W stock to force 0 saturation
            const isBW = stocksData["Black & White Film"].some(s => s.name === name);

            if(name === "None") setSliderValues(5.00, 0.00, 0.00, 0.00, 5600, 32, 65);
            else if(isBW) {
                // Restoration of V2.2.3 B&W logic: saturation ALWAYS 0
                if(name.includes("Tri-X")) setSliderValues(0.00, 1.80, 6.50, 1.50, 5500, 75, 60);
                else if(name.includes("T-MAX")) setSliderValues(0.00, 0.50, 2.50, 1.00, 5600, 55, 65);
                else if(name.includes("HP5")) setSliderValues(0.00, 0.80, 3.50, 1.20, 5600, 45, 62);
                else if(name.includes("Rollei")) setSliderValues(0.00, 0.20, 1.00, 2.00, 5800, 95, 70);
                else setSliderValues(0.00, 1.00, 2.00, 1.00, 5600, 32, 65);
            }
            else if(name.includes("Portra")) setSliderValues(4.80, 1.20, 1.80, 1.00, 5400, 30, 65);
            else if(name.includes("Ektar")) setSliderValues(6.80, 0.80, 0.60, 1.00, 5600, 48, 62);
            else if(name.includes("Gold")) setSliderValues(5.80, 1.50, 3.50, 1.30, 5900, 38, 64);
            else if(name.includes("800T")) setSliderValues(5.50, 8.50, 4.50, 1.50, 3200, 42, 58);
            else if(name.includes("Velvia")) setSliderValues(9.20, 1.50, 1.50, 1.40, 5400, 55, 60);
            else if(name.includes("Metropolis")) setSliderValues(2.20, 0.60, 4.20, 1.80, 5200, 65, 48);
            else if(name.includes("Provia 100F")) setSliderValues(5.30, 0.80, 1.80, 1.00, 5600, 48, 65);
            else setSliderValues(5.00, 1.20, 2.00, 1.00, 5600, 32, 65);
        }

        function generarTodo() {
            const cam = document.getElementById('camera').value;
            const lens = document.getElementById('lens').value;
            const focal = document.getElementById('distance').value;
            const prof = document.getElementById('camera-profile').value;
            const stock = document.getElementById('stock').value;
            const sat = parseFloat(document.getElementById('saturation').value);
            const hal = parseFloat(document.getElementById('halation').value);
            const grn = parseFloat(document.getElementById('grain').value);
            const vig = parseFloat(document.getElementById('vignette').value);
            const white = document.getElementById('whitePoint').value;
            const con = parseInt(document.getElementById('contrast').value);
            const skin = parseInt(document.getElementById('skinLuma').value);

            const json = {
                "metadata": { "engine": "hyprframe.com", "version": "3.0.9" },
                "setup": { "camera": cam, "lens": lens, "focal": focal },
                "mapping": { "profile": prof, "stock": stock },
                "look": { "sat": sat, "hal": hal, "grain": grn, "vignette": vig, "white": white + "K", "contrast": con, "skin": skin }
            };
            document.getElementById('resultado').innerText = JSON.stringify(json, null, 2);

            let p = [];
            
            p.push(`[MASTER CINEMATOGRAPHY DATA]: Physical camera simulation parameters. Cinematographic capture system: ${cam}.`);
            
            let lensDesc = `Optical Configuration: ${lens} lens at ${focal}. `;
            if(lens.includes("Anamorphic")) lensDesc += "Oval bokeh, anamorphic horizontal flares, blue lens streaks, widescreen squeeze mapping. ";
            if(lens.includes("Baltar") || lens.includes("Panchro")) lensDesc += "Vintage optical warmth, soft focus fall-off, organic refractive character. ";
            if(parseInt(focal) <= 18) lensDesc += "Ultra-wide expansive field of view, deep spherical focus. ";
            if(parseInt(focal) >= 85) lensDesc += "Telephoto optical compression, intimate close-up detail, creamy shallow bokeh. ";
            p.push(lensDesc);

            if(prof !== "None") {
                p.push(`[SENSOR RAW DATA: ${prof} LOG CURVE]. Professional ultra-flat image response, milky washed-out shadows, extreme low contrast, desaturated neutral color science, preserved highlights, raw digital negative aesthetic.`);
            } else if(stock !== "None") {
                let stockDesc = `[EMULSION SIMULATION: ${stock}]. `;
                if(stock.includes("Portra")) stockDesc += "Warm organic skin tones, bronze-pink highlights, wide chemical latitude, professional daylight color response.";
                if(stock.includes("800T")) stockDesc += "Deep tungsten-balanced blues, massive red halation glow around point light sources, cinematic gritty film grain texture.";
                if(stock.includes("Tri-X")) stockDesc += "Noir high-contrast black and white, dramatic silver-halide grain texture, monochrome depth.";
                if(stock.includes("Metropolis")) stockDesc += "Urban-noir desaturated look, industrial greens and grays, high contrast street aesthetic.";
                if(stock.includes("Provia 100F")) stockDesc += "Natural color fidelity, professional reversal slide aesthetic, deep blacks, high-fidelity accuracy, RMS 8 invisible grain texture.";
                p.push(stockDesc);
            }

            p.push(`White Balance: ${white}K`);

            // 6-LEVEL SEMANTIC MAPPING FOR SLIDERS
            let satSem = "";
            if(sat === 0) satSem = "Zero chroma, absolute monochromatic grayscale.";
            else if(sat <= 2) satSem = "Severely desaturated, bleached color palette, minimal color information.";
            else if(sat <= 4) satSem = "Subdued, muted tones, low-key color intensity.";
            else if(sat <= 6) satSem = "Natural color balance, faithful chromatic response.";
            else if(sat <= 8) satSem = "Richly saturated, vivid primary colors, high chromatic density.";
            else satSem = "Hyper-vivid, intense color pop, neon-like saturation levels.";
            p.push(`Visual Palette: ${satSem}`);

            let halSem = "";
            if(hal === 0) halSem = "No light bleeding, zero glow, sharp highlight edges.";
            else if(hal <= 2) halSem = "Subtle highlight roll-off, slight organic glow.";
            else if(hal <= 4) halSem = "Noticeable light blooming, gentle softening of light sources.";
            else if(hal <= 6) halSem = "Distinct cinematic halation, red-tinged glow around highlights.";
            else if(hal <= 8) halSem = "Heavy ethereal blooming, pronounced dreamlike light diffusion.";
            else halSem = "Extreme light bleed, massive glow artifacts, highly stylized blooming.";
            p.push(`Light Response: ${halSem}`);

            let grnSem = "";
            if(grn === 0) grnSem = "Clean digital sensor surface, zero noise, clinical clarity.";
            else if(grn <= 2) grnSem = "Extremely fine cinematic grain, barely perceptible micro-texture.";
            else if(grn <= 4) grnSem = "Noticeable organic film grain, professional 35mm stock feel.";
            else if(grn <= 6) grnSem = "Coarse silver-halide structure, gritty cinematic surface.";
            else if(grn <= 8) grnSem = "Heavy atmospheric grain, rough 16mm/vintage texture.";
            else grnSem = "Extreme gritty noise, massive organic grain artifacts, aggressive film texture.";
            p.push(`Texture: ${grnSem}`);

            let vigSem = "";
            if(vig === 0) vigSem = "Zero vignetting, uniform brightness across the frame.";
            else if(vig <= 2) vigSem = "Subtle corner softening, natural lens light drop.";
            else if(vig <= 4) vigSem = "Visible vignette, gentle focus towards the center.";
            else if(vig <= 6) vigSem = "Pronounced corner fall-off, distinct frame edges.";
            else if(vig <= 8) vigSem = "Heavy vignette, tunnel-like focus, dramatic light shaping.";
            else vigSem = "Extreme light obstruction, black corners, intense centered attention.";
            p.push(`Optic Fall-off: ${vigSem}`);

            let conSem = "";
            if(con <= 16) conSem = "Ultra-low contrast, flat tonal range, zero shadows.";
            else if(con <= 33) conSem = "Soft cinematic contrast, gentle light roll-off.";
            else if(con <= 50) conSem = "Balanced dynamic range, standard cinematic contrast.";
            else if(con <= 67) conSem = "Punchy contrast, defined shadow areas, high micro-contrast.";
            else if(con <= 84) conSem = "High contrast chiaroscuro, deep shadows, dramatic highlights.";
            else conSem = "Extreme crushed blacks, hard lighting, aggressive dynamic pop.";
            p.push(`Lighting Ratios: ${conSem}`);

            let lumaSem = "";
            if(skin <= 16) lumaSem = "Severely underexposed skin, deep silhouette, zero detail.";
            else if(skin <= 33) lumaSem = "Low-key exposure, moody underexposed skin tones.";
            else if(skin <= 50) lumaSem = "Dimly lit skin, soft shadows, natural low-light feel.";
            else if(skin <= 67) lumaSem = "Perfectly exposed skin, balanced mid-tones (65 IRE).";
            else if(skin <= 84) lumaSem = "High-key exposure, bright glowing skin tones, slight overexposure.";
            else lumaSem = "Severely overexposed skin, clipped highlights, washed out detail.";
            p.push(`Exposure: ${lumaSem}`);

            document.getElementById('promptResultado').innerHTML = p.join("<br><br>");
        }

        function copyToClipboard(id) {
            const text = document.getElementById(id).innerText;
            const el = document.createElement('textarea'); el.value = text;
            document.body.appendChild(el); el.select(); document.execCommand('copy');
            document.body.removeChild(el);
            const t = document.getElementById('copyToast'); t.style.opacity = "1";
            setTimeout(() => t.style.opacity = "0", 2000);
        }

        function updateVal(id, val) { document.getElementById(id).innerText = val; }

        window.onload = () => { initDropdowns(); lucide.createIcons(); updateExclusion(); };
    </script>
</body>
</html>
